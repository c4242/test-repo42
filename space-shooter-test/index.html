<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Space Shooter Test</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #02030a; font-family: system-ui, sans-serif; color: #e8f0ff; }
    canvas { display: block; touch-action: none; }
    #hud { position: fixed; top: 12px; left: 16px; right: 16px; display: flex; justify-content: space-between; pointer-events: none; font-size: 18px; text-shadow: 0 0 6px #3af; }
    #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: rgba(2,3,10,0.6); cursor: pointer; }
    #overlay h1 { font-size: clamp(32px, 8vw, 64px); margin: 0 0 12px; letter-spacing: 4px; color: #7cf; text-shadow: 0 0 18px #39f; }
    #overlay p { margin: 6px 16px; opacity: 0.85; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="hud"><span id="score">Score: 0</span><span id="lives">Lives: 3</span></div>
  <div id="overlay">
    <h1 id="title">SPACE SHOOTER</h1>
    <p id="subtitle">Click / tap to start</p>
    <p>Move: WASD / Arrow keys &nbsp;·&nbsp; Fire: Space<br>Touch: drag to move (auto-fire)</p>
  </div>

  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
  <script type="module">
    import * as THREE from 'three';

    // ---------- Setup ----------
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x02030a, 60, 180);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 400);
    camera.position.set(0, 6, 14);
    camera.lookAt(0, 0, -20);

    scene.add(new THREE.AmbientLight(0x6688aa, 0.6));
    const sun = new THREE.DirectionalLight(0xffffff, 1.4);
    sun.position.set(5, 10, 7);
    scene.add(sun);

    const BOUNDS = { x: 12, y: 6 };

    // ---------- Starfield ----------
    const STAR_COUNT = 1500;
    const starGeo = new THREE.BufferGeometry();
    const starPos = new Float32Array(STAR_COUNT * 3);
    for (let i = 0; i < STAR_COUNT; i++) {
      starPos[i * 3] = (Math.random() - 0.5) * 200;
      starPos[i * 3 + 1] = (Math.random() - 0.5) * 120;
      starPos[i * 3 + 2] = -Math.random() * 300;
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.4 }));
    scene.add(stars);

    // ---------- Player ----------
    function makePlayer() {
      const g = new THREE.Group();
      const hullMat = new THREE.MeshStandardMaterial({ color: 0x9fb8d8, metalness: 0.6, roughness: 0.35 });
      const body = new THREE.Mesh(new THREE.ConeGeometry(0.7, 3, 8), hullMat);
      body.rotation.x = -Math.PI / 2;
      g.add(body);
      const wing = new THREE.Mesh(new THREE.BoxGeometry(4, 0.12, 1.2), hullMat);
      wing.position.z = 0.6;
      g.add(wing);
      const cockpit = new THREE.Mesh(new THREE.SphereGeometry(0.35, 12, 8),
        new THREE.MeshStandardMaterial({ color: 0x33ccff, emissive: 0x1166aa }));
      cockpit.position.set(0, 0.35, -0.2);
      g.add(cockpit);
      const engine = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.45, 0.4, 10),
        new THREE.MeshBasicMaterial({ color: 0xff8833 }));
      engine.rotation.x = Math.PI / 2;
      engine.position.z = 1.6;
      g.add(engine);
      return g;
    }
    const player = makePlayer();
    scene.add(player);

    // ---------- Shared geometries / materials ----------
    const laserGeo = new THREE.BoxGeometry(0.12, 0.12, 1.4);
    const laserMat = new THREE.MeshBasicMaterial({ color: 0x55ffaa });
    const enemyGeo = new THREE.OctahedronGeometry(1.1, 0);
    const rockGeo = new THREE.IcosahedronGeometry(1.4, 0);
    const sparkGeo = new THREE.BoxGeometry(0.2, 0.2, 0.2);

    // ---------- State ----------
    let lasers = [], enemies = [], particles = [];
    let score = 0, lives = 3, running = false;
    let fireCooldown = 0, spawnTimer = 0, elapsed = 0, invuln = 0;
    const keys = {};
    let touchTarget = null;

    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const overlay = document.getElementById('overlay');
    const titleEl = document.getElementById('title');
    const subEl = document.getElementById('subtitle');

    function updateHud() {
      scoreEl.textContent = `Score: ${score}`;
      livesEl.textContent = `Lives: ${lives}`;
    }

    function clearAll() {
      for (const o of [...lasers, ...enemies, ...particles]) scene.remove(o.mesh);
      lasers = []; enemies = []; particles = [];
    }

    function startGame() {
      clearAll();
      score = 0; lives = 3; elapsed = 0; spawnTimer = 0; invuln = 1.5;
      player.position.set(0, 0, 0);
      player.visible = true;
      updateHud();
      overlay.classList.add('hidden');
      running = true;
    }

    function gameOver() {
      running = false;
      player.visible = false;
      titleEl.textContent = 'GAME OVER';
      subEl.textContent = `Score: ${score} — click / tap to play again`;
      overlay.classList.remove('hidden');
    }

    overlay.addEventListener('click', startGame);

    // ---------- Input ----------
    addEventListener('keydown', e => {
      keys[e.code] = true;
      if (e.code === 'Space') e.preventDefault();
      if (!running && (e.code === 'Enter' || e.code === 'Space')) startGame();
    });
    addEventListener('keyup', e => { keys[e.code] = false; });

    const raycaster = new THREE.Raycaster();
    const playPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
    function pointerToWorld(cx, cy) {
      const ndc = new THREE.Vector2((cx / innerWidth) * 2 - 1, -(cy / innerHeight) * 2 + 1);
      raycaster.setFromCamera(ndc, camera);
      const p = new THREE.Vector3();
      return raycaster.ray.intersectPlane(playPlane, p) ? p : null;
    }
    renderer.domElement.addEventListener('pointerdown', e => { touchTarget = pointerToWorld(e.clientX, e.clientY); });
    renderer.domElement.addEventListener('pointermove', e => { if (touchTarget) touchTarget = pointerToWorld(e.clientX, e.clientY) || touchTarget; });
    addEventListener('pointerup', () => { touchTarget = null; });

    // ---------- Spawning ----------
    function fireLaser() {
      for (const dx of [-0.9, 0.9]) {
        const m = new THREE.Mesh(laserGeo, laserMat);
        m.position.set(player.position.x + dx, player.position.y, player.position.z - 1);
        scene.add(m);
        lasers.push({ mesh: m, speed: 90 });
      }
    }

    function spawnEnemy() {
      const isRock = Math.random() < 0.4;
      const mesh = new THREE.Mesh(isRock ? rockGeo : enemyGeo, new THREE.MeshStandardMaterial({
        color: isRock ? 0x8a7a6a : 0xff3355,
        emissive: isRock ? 0x000000 : 0x550011,
        flatShading: true, roughness: 0.7
      }));
      mesh.position.set((Math.random() - 0.5) * BOUNDS.x * 2, (Math.random() - 0.5) * BOUNDS.y * 2, -160);
      scene.add(mesh);
      const difficulty = 1 + elapsed / 40;
      enemies.push({
        mesh,
        hp: isRock ? 3 : 1,
        points: isRock ? 50 : 100,
        radius: isRock ? 1.4 : 1.1,
        speed: (isRock ? 22 : 30) * difficulty,
        spin: new THREE.Vector3(Math.random(), Math.random(), Math.random()).multiplyScalar(3),
        drift: isRock ? 0 : (Math.random() - 0.5) * 6,
        phase: Math.random() * Math.PI * 2
      });
    }

    function explode(pos, color, count = 18) {
      const mat = new THREE.MeshBasicMaterial({ color, transparent: true });
      for (let i = 0; i < count; i++) {
        const m = new THREE.Mesh(sparkGeo, mat);
        m.position.copy(pos);
        scene.add(m);
        particles.push({
          mesh: m, mat, life: 0.8,
          vel: new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize().multiplyScalar(8 + Math.random() * 12)
        });
      }
    }

    // ---------- Loop ----------
    const clock = new THREE.Clock();
    function tick() {
      const dt = Math.min(clock.getDelta(), 0.05);

      // Stars stream toward the camera
      const sp = starGeo.attributes.position.array;
      const starSpeed = running ? 60 : 15;
      for (let i = 2; i < sp.length; i += 3) {
        sp[i] += starSpeed * dt;
        if (sp[i] > 20) sp[i] -= 320;
      }
      starGeo.attributes.position.needsUpdate = true;

      if (running) {
        elapsed += dt;

        // Player movement
        const speed = 16;
        let vx = 0, vy = 0;
        if (keys.KeyA || keys.ArrowLeft) vx -= 1;
        if (keys.KeyD || keys.ArrowRight) vx += 1;
        if (keys.KeyW || keys.ArrowUp) vy += 1;
        if (keys.KeyS || keys.ArrowDown) vy -= 1;
        if (touchTarget) {
          const dx = touchTarget.x - player.position.x, dy = touchTarget.y - player.position.y;
          vx = THREE.MathUtils.clamp(dx, -1, 1);
          vy = THREE.MathUtils.clamp(dy, -1, 1);
        }
        player.position.x = THREE.MathUtils.clamp(player.position.x + vx * speed * dt, -BOUNDS.x, BOUNDS.x);
        player.position.y = THREE.MathUtils.clamp(player.position.y + vy * speed * dt, -BOUNDS.y, BOUNDS.y);
        player.rotation.z = THREE.MathUtils.lerp(player.rotation.z, -vx * 0.6, 0.15);
        player.rotation.x = THREE.MathUtils.lerp(player.rotation.x, vy * 0.3, 0.15);

        // Invulnerability blink
        if (invuln > 0) {
          invuln -= dt;
          player.visible = Math.floor(invuln * 12) % 2 === 0;
          if (invuln <= 0) player.visible = true;
        }

        // Firing
        fireCooldown -= dt;
        if ((keys.Space || touchTarget) && fireCooldown <= 0) {
          fireLaser();
          fireCooldown = 0.16;
        }

        // Spawning
        spawnTimer -= dt;
        if (spawnTimer <= 0) {
          spawnEnemy();
          spawnTimer = Math.max(0.25, 1.1 - elapsed / 60);
        }

        // Lasers
        for (let i = lasers.length - 1; i >= 0; i--) {
          const l = lasers[i];
          l.mesh.position.z -= l.speed * dt;
          if (l.mesh.position.z < -170) { scene.remove(l.mesh); lasers.splice(i, 1); }
        }

        // Enemies
        for (let i = enemies.length - 1; i >= 0; i--) {
          const e = enemies[i];
          e.mesh.position.z += e.speed * dt;
          e.mesh.position.x += Math.sin(elapsed * 2 + e.phase) * e.drift * dt;
          e.mesh.rotation.x += e.spin.x * dt;
          e.mesh.rotation.y += e.spin.y * dt;

          // Laser hits
          let dead = false;
          for (let j = lasers.length - 1; j >= 0; j--) {
            if (lasers[j].mesh.position.distanceTo(e.mesh.position) < e.radius + 0.4) {
              scene.remove(lasers[j].mesh); lasers.splice(j, 1);
              e.hp--;
              e.mesh.material.emissive.setHex(0xffffff);
              setTimeout(() => e.mesh.material.emissive.setHex(e.points === 100 ? 0x550011 : 0x000000), 60);
              if (e.hp <= 0) { dead = true; break; }
            }
          }
          if (dead) {
            explode(e.mesh.position, e.points === 100 ? 0xff5566 : 0xccaa88);
            score += e.points; updateHud();
            scene.remove(e.mesh); enemies.splice(i, 1);
            continue;
          }

          // Player collision
          if (invuln <= 0 && e.mesh.position.distanceTo(player.position) < e.radius + 1.0) {
            explode(player.position, 0x66ccff, 30);
            scene.remove(e.mesh); enemies.splice(i, 1);
            lives--; updateHud();
            if (lives <= 0) { gameOver(); break; }
            invuln = 2;
            continue;
          }

          if (e.mesh.position.z > 20) { scene.remove(e.mesh); enemies.splice(i, 1); }
        }

        // Gentle camera follow
        camera.position.x = THREE.MathUtils.lerp(camera.position.x, player.position.x * 0.4, 0.05);
        camera.position.y = THREE.MathUtils.lerp(camera.position.y, 6 + player.position.y * 0.3, 0.05);
        camera.lookAt(player.position.x * 0.3, player.position.y * 0.3, -20);
      }

      // Particles (keep animating after game over)
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= dt;
        p.mesh.position.addScaledVector(p.vel, dt);
        p.mat.opacity = Math.max(0, p.life / 0.8);
        if (p.life <= 0) { scene.remove(p.mesh); particles.splice(i, 1); }
      }

      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    }
    tick();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
